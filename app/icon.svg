<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Outer background, matches --background -->
  <rect width="64" height="64" rx="14" fill="#06080D"/>
  <!-- Inner panel, matches --surface with line-strong stroke -->
  <rect x="10" y="10" width="44" height="44" rx="10" fill="#0D1018" stroke="#3A4555" stroke-width="2"/>
  <!-- Outer diamond outline, icy blue accent -->
  <path d="M32 13 L51 32 L32 51 L13 32 Z" fill="none" stroke="#9AD9FF" stroke-width="5" stroke-linejoin="round"/>
  <!-- Inner filled diamond, icy blue accent -->
  <path d="M32 22 L42 32 L32 42 L22 32 Z" fill="#9AD9FF"/>
  <!-- Centre cutout, back to background colour for the lens "pupil" -->
  <circle cx="32" cy="32" r="4" fill="#06080D"/>
</svg>
